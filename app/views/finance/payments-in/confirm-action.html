{% extends "finance/payments-in/layout.html" %}
{% block paymentContent %}
<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">
{% if text %}<p class="govuk-body">{{ text }}</p>{% endif %}
{% if rows %}{{ govukSummaryList({ rows: rows }) }}{% endif %}
<form method="post" action="{{ formAction }}"><div class="govuk-button-group">
  {{ govukButton({ text: buttonText, classes: "govuk-button--warning", preventDoubleClick: true }) }}
  <a class="govuk-link" href="{{ cancelHref }}">Cancel</a>
</div></form>
</div></div>
{% endblock %}

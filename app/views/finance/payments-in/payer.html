{% extends "finance/payments-in/layout.html" %}
{% block paymentContent %}
<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">
<form method="post" action="{{ payManual }}/payer" novalidate data-module="rm-route-guard" id="pay-payer-form">
  {% include "finance/payments-in/_payer-fields.html" %}
  <div class="govuk-button-group">{{ govukButton({ text: "Continue" }) }}{{ govukButton({ text: "Cancel", name: "pay-action", value: "cancel", classes: "govuk-button--secondary" }) }}</div>
</form>
</div></div>
{% endblock %}

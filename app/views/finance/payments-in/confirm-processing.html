{% extends "finance/payments-in/layout.html" %}
{% block paymentContent %}
<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">
<p class="govuk-body">You have selected {{ count }} of {{ availableCount }} files to process.</p>
<form method="post" action="{{ payAuto }}/confirm-processing" novalidate>
  <div class="govuk-button-group">{{ govukButton({ text: "Process", preventDoubleClick: true }) }}<a class="govuk-link" href="{{ payAuto }}/cancel-processing">Cancel</a></div>
</form>
</div></div>
{% endblock %}

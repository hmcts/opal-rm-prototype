{% extends "finance/indicative/layout.html" %}
{% block financeContent %}
<div class="govuk-grid-row"><div class="govuk-grid-column-two-thirds">
  {% if summaryRows.length %}{{ govukSummaryList({ rows: summaryRows }) }}{% endif %}
  <h2 class="govuk-heading-m">Checks to do</h2>
  {{ govukTaskList({ idPrefix: "finance-check", items: tasks }) }}
  <p class="govuk-body"><a class="govuk-link" href="/finance">Return to finance</a></p>
</div></div>
{% endblock %}
